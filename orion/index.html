<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오리온리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>
        <main>
            <div class="hero-sec">
                <!-- Slider main container -->
                <div class="swiper visual">
                    <!-- Additional required wrapper -->
                    <div class="swiper-wrapper">
                        <!-- Slides -->
                        <div class="swiper-slide">
                            <img src="img/visual01.png" alt="초코파이배너" class="pc">
                            <img src="img/m_visual01.png" alt="모바일초코파이배너" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual02.png" alt="닥터유배너" class="pc">
                            <img src="img/m_visual02.png" alt="모바일닥터유배너" class="mo">
                        </div>
                        <div class="swiper-slide">Slide 2</div>
                        <div class="swiper-slide">Slide 3</div>
                        ...
                </div>
                
                <!-- If we need scrollbar -->
                <div class="swiper-scrollbar"></div>
            </div>
        </main>
        <footer>&copy</footer>
    </div>
    <script>
        const swiper = new Swiper('.hero-sec > .swiper', {
            // Optional parameters
            direction: 'horizontal',
            loop: true,

            // If we need pagination
            pagination: {
                el: '.visual .swiper-pagination',
            },

            // Navigation arrows
            navigation: {
                nextEl: '.visual .swiper-button-next',
                prevEl: '.visual .swiper-button-prev',
            },

            // And if we need scrollbar
            scrollbar: {
                el: '.visual .swiper-scrollbar',
            },
});
    </script>
</body>
</html>
