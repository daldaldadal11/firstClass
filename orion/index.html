<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오리온 리뉴얼 포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header class="site-header">
            <div class="header-inner">
                <a class="header-logo" href="#" aria-label="오리온 홈">
                    <img src="img/orion_logo.png" alt="오리온">
                </a>
                <nav class="header-nav" aria-label="주 메뉴">
                    <a href="#">회사소개</a>
                    <a href="#">사업 분야</a>
                    <a href="#">윤리경영</a>
                    <a href="#">투자정보</a>
                    <a href="#">뉴스룸</a>
                    <a href="#">고객센터</a>
                </nav>
                <div class="header-tools">
                    <a class="header-language" href="#">English</a>
                    <button class="header-menu" type="button" aria-label="메뉴 열기">
                        <img src="img/Menu.png" data-inverse-src="img/Menu.png" data-primary-src="img/Menu_p.png" alt="">
                    </button>
                </div>
            </div>
        </header>
        <main>
            <section class="hero-sec">
                <div class="swiper visual">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="img/visual1.png" alt="슬라이드 1 - 초코파이 정 배너" class="pc">
                            <img src="img/m_visual01.png" alt="모바일 슬라이드 1 - 초코파이 정 배너" class="mo">
                            <div class="slide-copy">
                                <span>맛있고 품질 좋은 제품을</span>
                                <span>합리적인 가격으로 공급합니다</span>
                            </div>
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual02.png" alt="슬라이드 2 - 닥터유 배너" class="pc">
                            <img src="img/m_visual02.png" alt="모바일 슬라이드 2 - 닥터유 배너" class="mo">
                            <div class="slide-copy">
                                <span>‘닥터유’는 현대인의 식습관을 고려한</span>
                                <span>맞춤 영양 설계 브랜드로</span>
                                <span>맛있는 건강을 추구합니다.</span>
                            </div>
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual03.png" alt="슬라이드 3 - 마켓오네이처 배너" class="pc">
                            <img src="img/m_visual03.png" alt="모바일 슬라이드 3 - 마켓오네이처 배너" class="mo">
                            <div class="slide-copy">
                                <span>‘마켓오네이처’는 자연원물 그대로의</span>
                                <span>정직하고 건강한 맛을 담은</span>
                                <span>오리온의 간편식사대용식 브랜드입니다.</span>
                            </div>
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual04.png" alt="슬라이드 4 - 바이오 배너" class="pc">
                            <img src="img/m_visual04.png" alt="모바일 슬라이드 4 - 바이오 배너" class="mo">
                            <div class="slide-copy">
                                <span>진단 키트 사업을 시작으로 백신, 신약 발굴 및 개발까지</span>
                                <span>제약/바이오 Platform 기업을 추구합니다.</span>
                            </div>
                        </div>
                    </div>

                    <div class="visual-controls">
                        <div class="visual-progress">
                            <div class="visual-pagination swiper-pagination"></div>
                            <div class="visual-scrollbar" aria-hidden="true"><span class="visual-progress-fill is-active"></span><span class="visual-progress-fill visual-progress-fill-next"></span></div>
                        </div>
                        <div class="visual-arrows">
                            <button type="button" class="visual-prev" aria-label="이전 배너">
                                <img src="img/Vector.svg" alt="">
                            </button>
                            <button type="button" class="visual-next" aria-label="다음 배너">
                                <img src="img/Vector.svg" alt="">
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const header = document.querySelector('.site-header');
        const headerMenuIcon = document.querySelector('.header-menu img');

        const progressFills = document.querySelectorAll('.visual-progress-fill');
        let activeProgressFill = progressFills[0];
        let nextProgressFill = progressFills[1];

        function startProgress(swiperInstance) {
            const nextLeft = (swiperInstance.realIndex * 25) + '%';

            nextProgressFill.style.animation = 'none';
            nextProgressFill.classList.remove('is-shrinking', 'is-active');
            nextProgressFill.style.left = nextLeft;
            nextProgressFill.style.transform = 'scaleX(0)';
            void nextProgressFill.offsetWidth;
            nextProgressFill.style.animation = 'heroProgress 5s linear forwards';

            activeProgressFill.style.animation = 'none';
            activeProgressFill.classList.remove('is-active');
            activeProgressFill.classList.add('is-shrinking');

            const previousFill = activeProgressFill;
            activeProgressFill = nextProgressFill;
            nextProgressFill = previousFill;

            window.setTimeout(function () {
                previousFill.classList.remove('is-shrinking');
                previousFill.style.transform = 'scaleX(0)';
            }, 1250);
        }

        function initializeProgress(swiperInstance) {
            activeProgressFill.style.left = (swiperInstance.realIndex * 25) + '%';
            activeProgressFill.style.animation = 'none';
            activeProgressFill.style.transform = 'scaleX(0)';
            void activeProgressFill.offsetWidth;
            activeProgressFill.style.animation = 'heroProgress 5s linear forwards';
        }

        function updateHeaderColor(swiperInstance) {
            const usePrimary = swiperInstance.realIndex === 1 || swiperInstance.realIndex === 2;
            header.classList.toggle('header-primary', usePrimary);
            headerMenuIcon.src = usePrimary
                ? headerMenuIcon.dataset.primarySrc
                : headerMenuIcon.dataset.inverseSrc;
        }

        const swiper = new Swiper('.hero-sec .visual', {
            direction: 'horizontal',
            loop: true,
            speed: 1600,
            autoplay: {
                delay: 5000,
                disableOnInteraction: false,
                pauseOnMouseEnter: false,
            },
            on: {
                init: function () {
                    updateHeaderColor(this);
                    startProgress(this);
                },
                slideChange: function () {
                    updateHeaderColor(this);
                    startProgress(this);
                },
            },
            pagination: {
                el: '.visual-pagination',
                clickable: true,
                renderBullet: function (index, className) {
                    const brands = ['오리온', '닥터유', '마켓오네이처', '바이오'];
                    return '<button type="button" class="' + className + '">' + brands[index] + '</button>';
                },
            },
            navigation: {
                nextEl: '.visual-next',
                prevEl: '.visual-prev',
            },
        });
    </script>
</body>
</html>
