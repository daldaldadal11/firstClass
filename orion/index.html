<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오리온리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>
        <main>
            <section class="hero-sec">
                <div class="swiper visual">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="img/visual1.png" alt="초코파이 배너" class="pc">
                            <img src="img/m_visual01.png" alt="모바일 초코파이 배너" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual02.png" alt="닥터유 배너" class="pc">
                            <img src="img/m_visual02.png" alt="모바일 닥터유 배너" class="mo">
                        </div>
                        <div class="swiper-slide">Slide 3</div>
                        <div class="swiper-slide">Slide 4</div>
                    </div>

                    <div class="visual-controls">
                        <div class="visual-progress">
                            <div class="visual-pagination swiper-pagination"></div>
                            <div class="visual-scrollbar swiper-scrollbar"></div>
                        </div>
                        <div class="visual-arrows">
                            <button type="button" class="visual-prev swiper-button-prev" aria-label="이전 배너"></button>
                            <button type="button" class="visual-next swiper-button-next" aria-label="다음 배너"></button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer>&copy;</footer>
    </div>

    <script>
        const swiper = new Swiper('.hero-sec .visual', {
            direction: 'horizontal',
            loop: true,
            speed: 700,
            pagination: {
                el: '.visual-pagination',
                clickable: true,
                renderBullet: function (index, className) {
                    const brands = ['오리온', '닥터유', '마켓오네이처', '바이오'];
                    return '<button type="button" class="' + className + '">' + brands[index % brands.length] + '</button>';
                },
            },
            navigation: {
                nextEl: '.visual-next',
                prevEl: '.visual-prev',
            },
            scrollbar: {
                el: '.visual-scrollbar',
                draggable: true,
                dragSize: 'auto',
            },
        });
    </script>
</body>
</html>
