<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="login.css">
    <title>써브웨이 아이디로 로그인</title>
</head>
<body>
    <div id="wrap">
        <header>
            <h1>아이디로 로그인</h1>
            <button type="button" class="prev_btn">
                <span class="sr-only">이전</span>
            </button>
        </header>

        <main>
            <h2 class="title">
                <span>아이디로</span>
                <span>로그인해주세요.</span>
            </h2>

            <form action="">
                <fieldset>
                    <legend class="sr-only">아이디 로그인</legend>

                    <div class="input_group">
                        <div class="input_box">
                            <label for="user_id" class="sr-only">아이디(이메일)</label>
                            <input type="email" id="user_id" name="user_id" placeholder="아이디(이메일)를 입력해 주세요.">
                        </div>

                        <div class="input_box password_box">
                            <label for="user_password" class="sr-only">비밀번호</label>
                            <input type="password" id="user_password" name="user_password" placeholder="비밀번호를 입력해주세요.">
                            <button type="button" class="pw_btn">
                                <span class="sr-only">비밀번호 보기</span>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="login_btn">로그인</button>
                </fieldset>
            </form>

            <nav class="login_link" aria-label="로그인 관련 메뉴">
                <ul>
                    <li><a href="#">아이디 찾기</a></li>
                    <li><a href="#">비밀번호 재설정</a></li>
                    <li><a href="#">회원가입</a></li>
                </ul>
            </nav>

            <section class="sns_login">
                <h2 class="sr-only">SNS 간편 로그인</h2>
                <p class="sns_title">SNS로 간편하게 로그인</p>

                <ul class="sns_list">
                    <li>
                        <a href="#">
                            <span class="sr-only">카카오 로그인</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <span class="sr-only">네이버 로그인</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <span class="sr-only">애플 로그인</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <span class="sr-only">삼성 로그인</span>
                        </a>
                    </li>
                </ul>
            </section>
        </main>
    </div>
</body>
</html>
